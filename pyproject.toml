[project]
name = "relay-grid-dag"
version = "0.1.0"
description = "Near-field Relay Grid: differentiable joint Tx/relay precoding and relay selection for geometry-aware mutual-information channel shaping, on the gaussian-dag K-recursion."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Tadashi Wadayama", email = "wadayama@nitech.ac.jp" },
]
keywords = [
    "near-field",
    "programmable-relay-grid",
    "relay-selection",
    "sparse-activation",
    "mimo",
    "mutual-information",
    "gaussian-dag",
    "ofdm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "gaussian-dag>=0.3",
    "cmi-dag>=0.6",
    "torch>=2.12",
    "numpy>=2.0",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/wadayama/relay-grid-dag"
Repository = "https://github.com/wadayama/relay-grid-dag"
Issues = "https://github.com/wadayama/relay-grid-dag/issues"

# The public MI kernels: gaussian-dag (single-root K-recursion) and cmi-dag
# (multi-root conditional MI). Resolved from Git and pinned to a specific commit
# so `uv lock --upgrade` does not silently track upstream HEAD. NOTE: these are
# uv-only sources (a plain `pip install .` cannot resolve the bare requirements);
# use `uv sync`. The near-field physics is vendored under relay_grid_dag/_nearfield/
# -- a frozen copy of wadayama/nearfield-dag, kept canonical here.
[tool.uv.sources]
gaussian-dag = { git = "https://github.com/wadayama/gaussian-dag", rev = "2d8abc5cb0a89fd1ba9309905a178530d8ee8aab" }
cmi-dag = { git = "https://github.com/wadayama/cmi-dag", rev = "21af74f09203f4d8ac7cae32ae32e54dbf489049" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay_grid_dag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
